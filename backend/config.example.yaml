# Copy to config.yaml (git-ignored) and edit. Anything you leave out keeps the
# default from internal/config/config.go.

db_path: data/jobpilot.db
http_addr: 127.0.0.1:8080

# The built dashboard (`make web-build`); served at / when it exists.
web_dir: ../web/dist

# How often the scheduler wakes up. Each source also has its own minimum
# interval (most boards only refresh hourly), so waking every 15 minutes does
# not mean every board is hit every 15 minutes.
tick: 15m

# Appended to the User-Agent so API owners can reach you if needed.
contact: ""

# Naming a source here replaces its whole entry, so keep `enabled: true`
# when you only want to change the interval.
sources:
  remoteok:       {enabled: true}                  # default interval 30m
  remotive:       {enabled: true}                  # 6h; Remotive asks for sparing use
  himalayas:      {enabled: true}                  # 1h
  weworkremotely: {enabled: true}                  # 1h
  jobicy:         {enabled: true}                  # 1h
  arbeitnow:      {enabled: false}                 # off: 0 of 286 jobs passed the region stage
  hackernews:     {enabled: true}                  # 6h; Who is hiring + Freelancer threads
  greenhouse:     {enabled: true}                  # 1h, per company below
  lever:          {enabled: true}
  ashby:          {enabled: true}

# Company job boards (the token is the name in the board's public URL).
# Every token below was checked to exist. Add your 500 target companies here.
boards:
  greenhouse: [gitlab, cloudflare, datadog, stripe, figma, vercel, mongodb, elastic]
  lever: [palantir, spotify]
  ashby: [ashby, linear, ramp, openai, notion]

# The funnel stages. All are regular expressions (Go/RE2 syntax). After editing
# them, run `server reclassify` to re-judge everything already collected.
# filter:
#   region_allow: ...
#   title_exclude: '(?i)\b(sales|recruit\w*|designer|support)\b'   # roles that aren't software engineering
# There is no stack filter: how well a job fits your technology is scored from your CV.

# CV matching. Your CV text is only ever sent to this Ollama, so by default
# only an address on this machine is accepted. Without Ollama (or with
# `enabled: false`), jobs are still matched on skills.
ollama:
  enabled: true
  url: http://127.0.0.1:11434
  # allow_remote: false   # set true only if you really want your CV sent to another machine
  embed_model: nomic-embed-text   # the wording-similarity model
  chat_model: ""                  # reads the CV; empty = use an installed model (qwen2.5:7b preferred)
  # embed_prefix: ""              # unset = the model's recommended prefix
  timeout: 3m

# How the fit score is made. Weights are relative. semantic_low/high map raw
# embedding similarity onto 0-100%. Raw similarity is never near 0 (with the
# default model it runs about 0.62-0.86), and where "related" starts depends on
# the model and your CV. Run `make calibrate` to measure it on your own data.
fit:
  skill_weight: 0.6
  semantic_weight: 0.4
  semantic_low: 0.72
  semantic_high: 0.82
